<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - MUST Exam Entry Verification System</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="topbar">
    <a href="/dashboard" style="color:#fff;">&larr; Dashboard</a>
    <span>My Profile</span>
  </nav>

  <div class="container">
    <div class="card">
      <h1>My Profile</h1>
      <p class="subtitle" id="roleMsg"></p>

      <form id="profileForm">
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" required>

        <label for="registration_number">Registration / Staff Number</label>
        <input type="text" id="registration_number" disabled>

        <label for="email">Email</label>
        <input type="email" id="email" required>

        <label for="password">New Password (leave blank to keep current)</label>
        <input type="password" id="password" minlength="6" placeholder="••••••••">

        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>
        <button type="submit">Save Changes</button>
      </form>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script>
    API.requireAuth();

    async function loadProfile() {
      try {
        const me = await API.request("/auth/me");
        document.getElementById("full_name").value = me.full_name;
        document.getElementById("registration_number").value = me.registration_number;
        document.getElementById("email").value = me.email;
        document.getElementById("roleMsg").textContent = "Role: " + roleLabel(me.role);
      } catch (err) {
        document.getElementById("errorMsg").textContent = "Failed to load your profile.";
        document.getElementById("errorMsg").style.display = "block";
      }
    }
    loadProfile();

    document.getElementById("profileForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorMsg = document.getElementById("errorMsg");
      const successMsg = document.getElementById("successMsg");
      errorMsg.style.display = "none";
      successMsg.style.display = "none";

      const payload = {
        full_name: document.getElementById("full_name").value,
        email: document.getElementById("email").value
      };
      const password = document.getElementById("password").value;
      if (password) payload.password = password;

      try {
        await API.request("/auth/me", {
          method: "PUT",
          body: JSON.stringify(payload)
        });
        successMsg.textContent = "Profile updated successfully.";
        successMsg.style.display = "block";
        document.getElementById("password").value = "";
      } catch (err) {
        errorMsg.textContent = err.data?.detail || "Failed to update profile.";
        errorMsg.style.display = "block";
      }
    });
  </script>
</body>
</html>
