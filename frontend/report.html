<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report ID - MUST Exam Entry Verification System</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="topbar">
    <a href="/dashboard" style="color:#fff;">&larr; Dashboard</a>
    <span>Report ID Card</span>
  </nav>

  <div class="container">
    <div class="card">
      <h1>Report Lost / Forgotten ID</h1>
      <p class="subtitle">Submit this as early as possible before your exam so your report can be processed at the right tier.</p>

      <form id="reportForm">
        <label for="card_owner_reg_no">Registration Number (ID owner)</label>
        <input type="text" id="card_owner_reg_no" placeholder="e.g. MUST/CS/2024/001" required>

        <label for="exam_id">Exam</label>
        <select id="exam_id" required>
          <option value="">Loading exams...</option>
        </select>

        <label for="report_type">Report Type</label>
        <select id="report_type">
          <option value="lost">Lost (location unknown)</option>
          <option value="forgotten">Forgotten (location known, e.g. left at home/hostel)</option>
        </select>

        <label for="location">Location (optional)</label>
        <input type="text" id="location" placeholder="e.g. Left at hostel room B12">

        <label for="description">Description (optional)</label>
        <textarea id="description" rows="3" placeholder="Any extra details"></textarea>

        <label style="display:flex; align-items:center; gap:8px; margin-top:16px; font-weight:normal;">
          <input type="checkbox" id="declaration_confirmed" style="width:auto;" required>
          I confirm this report is true and accurate. I understand that a false report may lead to disciplinary action.
        </label>

        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>
        <button type="submit">Submit Report</button>
      </form>
    </div>

    <div class="card">
      <h2>My Reports</h2>
      <p class="subtitle">Made a mistake? You can edit any report here until it's marked resolved.</p>
      <div class="error-msg" id="myErrorMsg"></div>
      <div class="success-msg" id="mySuccessMsg"></div>
      <table>
        <thead><tr><th>Reg No</th><th>Type</th><th>Tier</th><th>Status</th><th></th></tr></thead>
        <tbody id="myReportsBody"><tr><td colspan="5">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script>
    API.requireAuth();

    async function loadExams() {
      const select = document.getElementById("exam_id");
      try {
        const exams = await API.request("/exams/");
        if (exams.length === 0) {
          select.innerHTML = '<option value="">No exams available</option>';
          return;
        }
        select.innerHTML = exams.map(ex =>
          `<option value="${ex.id}">${ex.course_code} - ${ex.room} (${ex.exam_date} ${ex.exam_time})</option>`
        ).join("");
      } catch (err) {
        select.innerHTML = '<option value="">Failed to load exams</option>';
      }
    }
    loadExams();

    document.getElementById("reportForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorMsg = document.getElementById("errorMsg");
      const successMsg = document.getElementById("successMsg");
      errorMsg.style.display = "none";
      successMsg.style.display = "none";

      const payload = {
        card_owner_reg_no: document.getElementById("card_owner_reg_no").value,
        exam_id: parseInt(document.getElementById("exam_id").value),
        report_type: document.getElementById("report_type").value,
        declaration_confirmed: document.getElementById("declaration_confirmed").checked,
        location: document.getElementById("location").value || null,
        description: document.getElementById("description").value || null
      };

      try {
        const report = await API.request("/reports/", {
          method: "POST",
          body: JSON.stringify(payload)
        });
        successMsg.textContent = `Report submitted successfully. Tier: ${report.tier}.`;
        successMsg.style.display = "block";
        document.getElementById("reportForm").reset();
        loadMyReports();
      } catch (err) {
        errorMsg.textContent = err.data?.detail || "Failed to submit report.";
        errorMsg.style.display = "block";
      }
    });

    const myUserId = parseInt(decodeJWT(API.getToken()).sub);

    async function loadMyReports() {
      const tbody = document.getElementById("myReportsBody");
      tbody.innerHTML = '<tr><td colspan="5">Loading...</td></tr>';
      try {
        const reports = await API.request("/reports/");
        const mine = reports.filter(r => r.reporter_id === myUserId);
        if (mine.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5">No open reports.</td></tr>';
          return;
        }
        tbody.innerHTML = mine.map(r => `
          <tr data-id="${r.id}">
            <td><input class="regEdit" value="${r.card_owner_reg_no}"></td>
            <td>
              <select class="typeEdit">
                <option value="lost" ${r.report_type === "lost" ? "selected" : ""}>Lost</option>
                <option value="forgotten" ${r.report_type === "forgotten" ? "selected" : ""}>Forgotten</option>
              </select>
            </td>
            <td><span class="badge badge-tier${r.tier}">Tier ${r.tier}</span></td>
            <td>${r.status}</td>
            <td class="actions-cell" style="display:flex; gap:6px;">
              <button class="saveReport" style="width:auto; padding:6px 10px; margin:0; font-size:13px;">Save</button>
            </td>
          </tr>
        `).join("");
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="5">Failed to load your reports.</td></tr>';
      }
    }
    loadMyReports();

    document.getElementById("myReportsBody").addEventListener("click", async (e) => {
      if (!e.target.classList.contains("saveReport")) return;
      const row = e.target.closest("tr");
      const reportId = row.dataset.id;
      const myErrorMsg = document.getElementById("myErrorMsg");
      const mySuccessMsg = document.getElementById("mySuccessMsg");
      myErrorMsg.style.display = "none";
      mySuccessMsg.style.display = "none";
      try {
        await API.request(`/reports/${reportId}`, {
          method: "PATCH",
          body: JSON.stringify({
            card_owner_reg_no: row.querySelector(".regEdit").value,
            report_type: row.querySelector(".typeEdit").value
          })
        });
        mySuccessMsg.textContent = "Report updated.";
        mySuccessMsg.style.display = "block";
        loadMyReports();
      } catch (err) {
        myErrorMsg.textContent = err.data?.detail || "Failed to update report.";
        myErrorMsg.style.display = "block";
      }
    });
  </script>
</body>
</html>
